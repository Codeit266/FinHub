<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Brand Header (Locked to Top-Left) -->
    <div class="brand-header">
        <a href="index.html" class="brand-header-content">
            <img src="sait img.png" alt="SAIT Logo">
            <h1>FinHub</h1>
        </a>
    </div>

    <!-- Hamburger Menu Button -->
    <button class="menu-toggle" onclick="toggleMenu()" >
        ☰  
    </button>
 

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <ul class="menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="events.html"><i class="fas fa-calendar-alt"></i> Event Handling & Budgeting</a></li>
            <li><a href="pieChart.html"><i class="fas fa-chart-bar"></i>Pie Chart</a></li>
            <li><a href="CSV.html"><i class="fas fa-cog"></i> Export to CSV</a></li>
            <li><a href="pdf.html"><i class="fas fa-cog"></i> Export to PDF</a></li>
            <li><a href="report.html"><i class="fas fa-cog"></i> Download Report</a></li>
            <li> <button onclick="logout()" id="log-btn">Logout</button> </li>
        </ul>
    </div>

    <div class="add-container">
        <div class="form-container">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <label for="description">Description:</label>
                <input type="text" id="description" placeholder="Enter description" required>
                
                <label for="amount">Amount:</label>
                <input type="number" id="amount" placeholder="Enter amount" required>
                
                <label for="type">Type:</label>
                <select id="type">
                    <option value="credit">Credit</option>
                    <option value="debit">Debit</option>
                </select>

                <label for="date">Date:</label>
                <input type="date" id="date" required>

                <button type="submit">Add</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
