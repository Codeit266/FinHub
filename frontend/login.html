<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinHub Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Brand Header (Locked to Top-Left) -->
  <div class="brand-header">
      <a href="index.html" class="brand-header-content">
          <img src="sait img.png" alt="SAIT Logo">
          <h1>FinHub</h1>
      </a>
  </div>

  <div class="login-body-wrapper">
    <div class="login-container">
      <h2 id="login-title" style="margin-top: 1rem;">Sign In</h2>
     
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button onclick="sendLogin()">Send OTP</button>

      <div id="otp-section" style="display: none;">
        <input type="text" id="otp" placeholder="Enter OTP" />
        <button onclick="verifyOtp()">Verify OTP</button>
      </div>
    </div>
  </div>

  <div class="background-container">
    <div class="gradient-ball ball1"></div>
    <div class="gradient-ball ball2"></div>
    <div class="gradient-ball ball3"></div>
  </div>
  <script src="login.js"></script>
</body>
</html>
