<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Brand Header (Locked to Top-Left) -->
    <div class="brand-header">
        <a href="index.html" class="brand-header-content">
            <img src="sait img.png" alt="SAIT Logo">
            <h1>FinHub</h1>
        </a>
    </div>

    <!-- Hamburger Menu Button -->
    <button class="menu-toggle" onclick="toggleMenu()" >
        ☰  
    </button>
 

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <ul class="menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="events.html"><i class="fas fa-calendar-alt"></i> Event Handling & Budgeting</a></li>
            <li><a href="pieChart.html"><i class="fas fa-chart-bar"></i>Pie Chart</a></li>
            <li><a href="CSV.html"><i class="fas fa-cog"></i> Export to CSV</a></li>

            <li> <button onclick="logout()" id="log-btn">Logout</button> </li>
        </ul>
    </div>

    <div class="add-container">
        <div class="form-container">
            <h2>Add Event</h2>
            <form id="eventForm">
                <label for="event-name">Event Name:</label>
                <input type="text" id="event-name" placeholder="Enter event name" required>
                
                <label for="event-budget">Budget:</label>
                <input type="number" id="event-budget" placeholder="Enter budget" required>
                
                <button id="submit_btn" type="submit">Create Event</button>
            </form>
        </div>
    </div>

    <script src="add-event.js"></script>
</body>
</html>
